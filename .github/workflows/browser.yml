name: Live browser smoke tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Run deployed site checks
        env:
          BASE_URL: https://we-love-delays.onrender.com
          DEVICE: ${{ matrix.device }}
        run: npx playwright test tests/browser.spec.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.device }}
          path: test-results/
