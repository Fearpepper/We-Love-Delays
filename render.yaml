services:
  - type: web
    name: we-love-delays-berkeley
    runtime: python
    plan: free
    buildCommand: "echo 'No dependencies to install'"
    startCommand: "python server.py"
    healthCheckPath: /health
    envVars:
      - key: SF511_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
